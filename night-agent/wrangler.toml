# Night Agent, stage 1 (the Scout). Runs every 5 minutes from 1:00 to 4:55 a.m. Jamaica time (UTC−5, no daylight
# saving) = 06:00–09:55 UTC, and leaves a morning report. Free plan only: Workers, Cron Triggers and KV.
name = "night-agent"
main = "src/index.js"
compatibility_date = "2026-10-01"
account_id = "30f2c89d75621ddef8b783383296410f"
workers_dev = true
preview_urls = false

[triggers]
crons = ["*/5 6-9 * * *", "0 11 * * *"] # the night, and the 6:00 a.m. Jamaica email

[[kv_namespaces]]
binding = "SCOUT"
id = "87c18e78a88a473fb1d3320c6bba6422"

[vars]
# Models tried in order (the first one this key can use with Google Search grounding on the free tier).
GEMINI_MODELS = "gemini-2.5-flash,gemini-2.5-flash-lite,gemini-flash-latest"
# Raise this and redeploy to choose a new report passcode (forgotten passcode). Reports are kept.
RESET_GENERATION = "1"
# The morning report email (sent with Resend's free plan from its starter address, which can only email the address the
# Resend account was created with).
REPORT_EMAIL = "marlonapp.sales@gmail.com"
SITE_URL = "https://night-agent.marlon615.workers.dev"

# Secrets (never in this file): GEMINI_API_KEY (free key from aistudio.google.com) and RESEND_API_KEY (free key from
# resend.com), each added in Cloudflare as a secret on this Worker.
